<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0f172a" />
    <title>Page Not Found | UPKAR Generator</title>
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; min-height: 100vh; display: grid; place-items: center; padding: 2rem; background: #0f172a; color: #fff; font-family: ui-sans-serif, system-ui, sans-serif; text-align: center; }
      main { max-width: 42rem; }
      p:first-child { color: #fdba74; font-size: .875rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 1rem 0 0; font-size: clamp(2.25rem, 7vw, 4rem); line-height: 1.05; }
      p { color: #cbd5e1; line-height: 1.75; }
      nav { display: flex; flex-wrap: wrap; justify-content: center; gap: .75rem; margin-top: 2rem; }
      a { min-height: 2.75rem; display: inline-flex; align-items: center; justify-content: center; border-radius: .375rem; padding: .75rem 1.25rem; background: #c2410c; color: #fff; font-weight: 800; text-decoration: none; }
      a:last-child { background: #0f766e; }
      a:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p>404 · Page not found</p>
      <h1>We could not find that page</h1>
      <p>The address may be incorrect or the page may have moved. Return home or browse the available generator products.</p>
      <nav aria-label="Error page navigation">
        <a href="/">Return home</a>
        <a href="/products">Browse products</a>
      </nav>
    </main>
  </body>
</html>
